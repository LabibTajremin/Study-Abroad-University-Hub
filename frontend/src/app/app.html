<div class="app-shell" [class.mobile-nav-open]="mobileNavOpen">
  <!-- Sidebar -->
  <app-sidebar [mobileOpen]="mobileNavOpen" (sidebarToggled)="onSidebarToggled($event)" />

  <!-- Backdrop (mobile drawer) -->
  <div class="nav-backdrop" (click)="closeMobileNav()" aria-hidden="true"></div>

  <!-- Main Area -->
  <div class="main-area" [class.sidebar-collapsed]="sidebarCollapsed">
    <app-header (menuToggle)="toggleMobileNav()" />

    <main class="page-content">
      <router-outlet />
    </main>

    <app-footer />
  </div>
</div>
